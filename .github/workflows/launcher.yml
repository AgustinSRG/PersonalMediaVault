name: Launcher (CLI)

on:
  push:
    branches: [ "master" ]
    paths:
      - launcher/**
      - .github/workflows/launcher.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - launcher/**

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.22.x

    - name: Build
      working-directory: ./launcher
      run: go build -v ./...

    - name: Test
      working-directory: ./launcher
      run: go test -v ./...
