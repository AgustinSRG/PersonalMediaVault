name: Backup tool

on:
  push:
    branches: [ "master" ]
    paths:
      - backup-tool/**
      - .github/workflows/backup-tool.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - backup-tool/**

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25.x

    - name: Build
      working-directory: ./backup-tool
      run: go build -v ./...

    - name: Test
      working-directory: ./backup-tool
      run: go test -v ./...
