name: Backend

on:
  push:
    branches: [ "master" ]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - backend/**

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'backend/go.mod'

    - name: Set up ffmpeg 
      run: sudo apt install ffmpeg

    - name: Build
      working-directory: ./backend
      run: go build -v ./...

    - name: Test
      working-directory: ./backend
      run: go test -v ./...

